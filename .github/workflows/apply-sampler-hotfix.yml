name: Apply sampler lifecycle hotfix

on:
  push:
    branches: [frontend-instrument-overhaul]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[sampler-hotfix-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: frontend-instrument-overhaul
          fetch-depth: 0
      - name: Settle loaded-latency sampler on every transfer exit
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('public/app.js')
          source = path.read_text()
          old = """    let result;
              try {
                result = kind === 'down'
                  ? await downloadRun(totalBytes, calibration.streams, runToken, { record: true, account: true })
                  : await uploadRun(totalBytes, calibration.streams, runToken, { record: true, account: true });
              } finally {
                flag.active = false;
              }
              const loaded = await sampler;
          """
          new = """    let result;
              let transferError = null;
              try {
                result = kind === 'down'
                  ? await downloadRun(totalBytes, calibration.streams, runToken, { record: true, account: true })
                  : await uploadRun(totalBytes, calibration.streams, runToken, { record: true, account: true });
              } catch (error) {
                transferError = error;
              } finally {
                flag.active = false;
              }

              let loaded;
              try {
                loaded = await sampler;
              } catch (samplerError) {
                if (!transferError) throw samplerError;
              }
              if (transferError) throw transferError;
          """
          if source.count(old) != 1:
              raise SystemExit(f'Expected exactly one sampler block, found {source.count(old)}')
          path.write_text(source.replace(old, new))
          PY
          git diff --check
          git diff -- public/app.js
      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet -- public/app.js; then
            echo 'No patch required'
            exit 0
          fi
          git config user.name 'precision-speed-lab-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add public/app.js
          git commit -m 'Settle loaded latency sampler on cancellation [sampler-hotfix-applied]'
          git push origin HEAD:frontend-instrument-overhaul
