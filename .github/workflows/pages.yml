name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Build and validate static instrument
        env:
          PSL_API_BASE: ${{ vars.PSL_API_BASE }}
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir _site
          cp -R public/. _site/
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          site = Path('_site')
          api_base = os.environ.get('PSL_API_BASE', '').strip().rstrip('/')
          (site / 'runtime-config.js').write_text(
              f"window.__PSL_API_BASE__ = {json.dumps(api_base)};\n",
              encoding='utf-8',
          )

          path = site / 'index.html'
          html = path.read_text(encoding='utf-8')
          html = html.replace('href="/" aria-label=', 'href="./" aria-label=')
          html = html.replace('href="/styles.css"', 'href="./styles.css"')
          html = html.replace('href="/accessibility.css"', 'href="./accessibility.css"')
          html = html.replace(
              '<script type="module" src="/app.js"></script>',
              '<script src="./runtime-config.js"></script>\n'
              '  <script type="module" src="./pages-bootstrap.js"></script>\n'
              '  <script type="module" src="./app.js"></script>',
          )
          path.write_text(html, encoding='utf-8')
          PY
          node --check _site/app.js
          node --check _site/measurement-core.js
          node --check _site/ui-core.js
          node --check _site/pages-bootstrap.js
          node --check _site/runtime-config.js
          test -s _site/styles.css
          test -s _site/accessibility.css
          test -s _site/app.js
          grep -q 'Precision Speed Lab' _site/index.html
          grep -q 'href="./styles.css"' _site/index.html
          grep -q 'href="./accessibility.css"' _site/index.html
          grep -q './pages-bootstrap.js' _site/index.html
          if grep -Eq '(href|src)="/(styles\.css|accessibility\.css|app\.js)"' _site/index.html; then
            echo 'Root-relative production asset survived Pages build' >&2
            exit 1
          fi
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
