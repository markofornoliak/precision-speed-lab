name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - 'server.js'
      - 'src/**'
      - 'test/**'
      - 'package.json'
      - 'Dockerfile'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'server.js'
      - 'src/**'
      - 'test/**'
      - 'package.json'
      - 'Dockerfile'
      - '.github/workflows/backend-ci.yml'

permissions:
  contents: read

jobs:
  backend-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax and integration tests
        run: npm run check

      - name: Build production container
        run: docker build -t precision-speed-lab:test .
