name: Production CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }} checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Syntax, statistics and integration tests
        run: npm run check

  container-smoke:
    name: Production container smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: docker compose config >/dev/null

      - name: Build production image
        run: docker build --pull -t precision-speed-lab:test .

      - name: Start hardened production container
        run: |
          docker run -d --name precision-speed-lab-ci \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=16m \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            -p 3000:3000 \
            precision-speed-lab:test

      - name: End-to-end frontend and measurement API smoke test
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:3000/api/health >/dev/null; then
              break
            fi
            sleep 1
          done

          curl --fail --silent http://127.0.0.1:3000/ | grep 'Precision Speed Lab'
          curl --fail --silent http://127.0.0.1:3000/app.js | grep 'runMainThroughput'
          curl --fail --silent http://127.0.0.1:3000/measurement-core.js | grep 'bootstrapMedianConfidenceInterval'
          curl --fail --silent http://127.0.0.1:3000/api/capabilities | grep '"streamingUpload":true'

          downloaded=$(curl --fail --silent 'http://127.0.0.1:3000/api/download?bytes=1048576' | wc -c)
          test "$downloaded" -eq 1048576

          head -c 1048576 /dev/zero | \
            curl --fail --silent \
              -H 'Content-Type: application/octet-stream' \
              --data-binary @- \
              http://127.0.0.1:3000/api/upload | grep '"received":1048576'

      - name: Container logs on failure
        if: failure()
        run: docker logs precision-speed-lab-ci || true

      - name: Stop container
        if: always()
        run: docker rm -f precision-speed-lab-ci || true
