name: Production CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }} checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install development-only QA dependencies
        run: npm install --no-audit --no-fund

      - name: Syntax, measurement, state-machine and frontend-budget checks
        run: npm run check

  browser-quality:
    name: Browser, accessibility and visual QA
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install development-only QA dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium and WebKit test engines
        run: npx playwright install --with-deps chromium webkit

      - name: Behavioral, viewport, lifecycle and accessibility tests
        run: npx playwright test test/browser/instrument.spec.mjs test/browser/viewports.spec.mjs

      - name: Generate deterministic visual baseline fingerprints
        env:
          VISUAL_UPDATE: '1'
        run: npx playwright test test/browser/visual.spec.mjs --project=chromium

      - name: Upload browser QA report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  container-smoke:
    name: Production container smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [test, browser-quality]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: docker compose config >/dev/null

      - name: Build production image
        run: docker build --pull -t precision-speed-lab:test .

      - name: Start hardened production container
        run: |
          docker run -d --name precision-speed-lab-ci \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=16m \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            -p 3000:3000 \
            precision-speed-lab:test

      - name: End-to-end frontend and measurement API smoke test
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:3000/api/health >/dev/null; then
              break
            fi
            sleep 1
          done

          curl --fail --silent http://127.0.0.1:3000/ | grep 'Precision Speed Lab'
          curl --fail --silent http://127.0.0.1:3000/app.js | grep 'class TelemetryPresenter'
          curl --fail --silent http://127.0.0.1:3000/ui-core.js | grep 'createStateMachine'
          curl --fail --silent http://127.0.0.1:3000/measurement-core.js | grep 'receiveWindowSummary'
          curl --fail --silent http://127.0.0.1:3000/api/capabilities | grep '"serverReceiveTiming":true'

          downloaded=$(curl --fail --silent 'http://127.0.0.1:3000/api/download?bytes=1048576' | wc -c)
          test "$downloaded" -eq 1048576

          upload_result=$(head -c 1048576 /dev/zero | \
            curl --fail --silent \
              -H 'Content-Type: application/octet-stream' \
              --data-binary @- \
              http://127.0.0.1:3000/api/upload)
          echo "$upload_result" | grep '"received":1048576'
          echo "$upload_result" | grep '"receiveStartedNs":"[0-9]'
          echo "$upload_result" | grep '"receiveEndedNs":"[0-9]'

          zero_status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            -H 'Content-Type: application/octet-stream' \
            --data-binary '' \
            http://127.0.0.1:3000/api/upload)
          test "$zero_status" -eq 400

      - name: Container logs on failure
        if: failure()
        run: docker logs precision-speed-lab-ci || true

      - name: Stop container
        if: always()
        run: docker rm -f precision-speed-lab-ci || true
