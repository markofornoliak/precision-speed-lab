name: Apply frontend transport hotfix

on:
  push:
    branches: [frontend-instrument-overhaul]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[transport-hotfix-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: frontend-instrument-overhaul
          fetch-depth: 0
      - name: Apply surgical transport patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('public/app.js')
          source = path.read_text()
          old = """function supportsStreamingUpload() {
            try {
              if (typeof ReadableStream === 'undefined' || typeof Request === 'undefined') return false;
              let duplexAccessed = false;
              const body = new ReadableStream({ start(controller) { controller.close(); } });
              const request = new Request(location.href, {
                method: 'POST',
                body,
                get duplex() { duplexAccessed = true; return 'half'; },
              });
              return duplexAccessed && request.body instanceof ReadableStream;
            } catch {
              return false;
            }
          }
          """
          new = """function supportsStreamingUpload() {
            const negotiatedProtocol = String(state.nextHopProtocol || '').toLowerCase();
            const transportSupportsStreaming = negotiatedProtocol === 'h2' || negotiatedProtocol.startsWith('h3');
            if (!transportSupportsStreaming) return false;
            try {
              if (typeof ReadableStream === 'undefined' || typeof Request === 'undefined') return false;
              let duplexAccessed = false;
              const body = new ReadableStream({ start(controller) { controller.close(); } });
              const request = new Request(location.href, {
                method: 'POST',
                body,
                get duplex() { duplexAccessed = true; return 'half'; },
              });
              return duplexAccessed && request.body instanceof ReadableStream;
            } catch {
              return false;
            }
          }
          """
          if source.count(old) != 1:
              raise SystemExit(f'Expected exactly one supportsStreamingUpload block, found {source.count(old)}')
          path.write_text(source.replace(old, new))
          PY
          git diff --check
          git diff -- public/app.js
      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet -- public/app.js; then
            echo 'No patch required'
            exit 0
          fi
          git config user.name 'precision-speed-lab-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add public/app.js
          git commit -m 'Harden upload streaming transport detection [transport-hotfix-applied]'
          git push origin HEAD:frontend-instrument-overhaul
